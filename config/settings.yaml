# QuantX — Institutional Trading Agent Configuration
# Capital preservation is the primary objective.

agent:
  name: QuantX
  version: "1.0.0"
  mode: paper  # paper | live (live requires broker credentials)

capital:
  initial: 1000000  # INR
  currency: INR

risk:
  max_risk_per_trade_pct: 1.0      # Never risk more than 1% per trade
  max_daily_loss_pct: 2.0         # Halt after 2% daily loss
  max_weekly_loss_pct: 5.0        # Halt after 5% weekly loss
  max_open_positions: 3           # Cap concurrency to limit overtrading
  min_risk_reward: 2.0            # Minimum 1:2 RR
  max_consecutive_losses: 3       # Stop after 3 consecutive losses
  max_drawdown_pct: 10.0          # Kill switch threshold
  min_liquidity_avg_volume: 100000
  max_aggregate_open_risk_pct: 3.0  # Sum of capital_at_risk across opens
  max_trades_per_day: 5
  include_unrealized_in_loss_limits: true
  soft_daily_loss_pct: 1.0        # Soft halt new entries earlier
  soft_weekly_loss_pct: 2.5
  soft_drawdown_pct: 5.0
  pause_after_consecutive_losses: 1
  loss_pause_minutes_per_streak: 30

markets:
  exchanges:
    - NSE
    - BSE
  products:
    - equity
    - futures
    - options
    - etf
  styles:
    - intraday
    - swing
  trading_hours:
    open: "09:15"
    close: "15:30"
    timezone: Asia/Kolkata
  pre_market: "09:00"
  post_market: "15:40"

position_sizing:
  method: atr  # atr | fixed_pct | volatility
  atr_multiplier: 2.5            # ATR stop distance (was 2.0 — noise stop-outs)
  default_atr_period: 14
  min_stop_atr_mult: 2.0         # refuse stops tighter than 2×ATR

# Paper trading market data — Yahoo Finance only (stocks + F&O underlyings)
market_data:
  provider: yahoo_finance
  yahoo_only: true
  allow_synthetic: false
  quote_cache_ttl_sec: 60
  ohlc_cache_ttl_sec: 300

indicators:
  ema_periods: [9, 21, 50, 200]
  sma_periods: [20, 50, 200]
  rsi_period: 14
  macd: {fast: 12, slow: 26, signal: 9}
  adx_period: 14
  atr_period: 14
  bollinger: {period: 20, std: 2}
  supertrend: {period: 10, multiplier: 3.0}

entry:
  require_trend: true
  require_momentum: true
  require_volume: true
  require_adx: true
  min_adx: 25.0                  # ADX strength confirmation (TECHM post-mortem)
  min_volume_ratio: 1.3
  min_breakout_volume_ratio: 1.5
  min_confidence: 60
  min_fundamental_score: 50
  avoid_major_news: true
  min_confluence_factors: 4
  require_fundamental_metrics: true
  require_rsi_alignment: true
  min_rsi_long: 52.0
  max_rsi_short: 48.0
  require_ema_stack: true
  block_breakout_on_vix_complacency: true
  block_on_vix_elevated: true

exit:
  use_atr_stop: true
  use_trailing_stop: true
  trailing_atr_mult: 2.0
  trail_after_r: 1.0
  time_exit_bars: 20
  exit_on_opposite_ema_stack: true
  force_flat_on_hard_loss_limit: true

broker:
  name: paper
  slippage_bps: 5          # adverse fill slippage
  # Live credentials via environment variables only:
  # QUANTX_BROKER_API_KEY, QUANTX_BROKER_API_SECRET, QUANTX_BROKER_ACCESS_TOKEN

paper:
  auto_execute: true
  default_interval_sec: 60
  enable_fno: true
  max_fo_positions: 2
  max_positions_per_symbol: 1
  max_new_entries_per_cycle: 1
  symbol_cooldown_hours: 24
  chase_cooldown_minutes: 60
  prioritize_unique_symbols: true
  # Cap how many products (SWING/FUT/OPT) can stack on one underlying
  fo_universe:
    - NIFTY
    - BANKNIFTY
    - RELIANCE
    - TCS
    - INFY
    - HDFCBANK
    - ICICIBANK
    - SBIN
  universe:
    - RELIANCE
    - TCS
    - INFY
    - HDFCBANK
    - ICICIBANK
    - SBIN
    - BHARTIARTL
    - ITC
    - LT
    - AXISBANK

database:
  path: data/quantx.db

logging:
  level: INFO
  path: data/quantx.log
